<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="theme.css" />
    <title>Submit Preview</title>
    <style>
      body { padding: 32px; }
      .wrap { max-width: 900px; margin: 0 auto; }
      .form-grid { display: grid; gap: 16px; }
      .field { display: grid; gap: 8px; }
      input, textarea { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px 14px; font: inherit; }
      textarea { min-height: 120px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" style="padding: 24px;">
        <h2>Submit request</h2>
        <div class="form-grid" style="margin-top:20px;">
          <div class="field">
            <label>Name</label>
            <input value="Alex Morgan" />
          </div>
          <div class="field">
            <label>Email</label>
            <input value="alex@northwindlabs.com" />
          </div>
          <div class="field">
            <label>Company</label>
            <input value="Northwind Labs" />
          </div>
          <div class="field">
            <label>Need</label>
            <textarea>Customer onboarding and rollout support.</textarea>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:12px;">
            <button class="secondary-button">Cancel</button>
            <button class="primary-button">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
