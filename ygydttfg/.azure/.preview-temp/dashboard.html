<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="theme.css" />
    <title>Dashboard Preview</title>
    <style>
      body { padding: 32px; }
      .wrap { max-width: 1200px; margin: 0 auto; }
      .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
      .card { padding: 18px; }
      table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      th, td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--color-border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" style="padding: 20px;">
        <h2>Dashboard</h2>
        <div class="stats">
          <div class="card"><div class="badge">Users</div><h3>1,248</h3><small>+12.4%</small></div>
          <div class="card"><div class="badge">Conversion</div><h3>7.6%</h3><small>+1.3%</small></div>
          <div class="card"><div class="badge">Tasks</div><h3>18</h3><small>-3 this week</small></div>
          <div class="card"><div class="badge">Health</div><h3>Healthy</h3><small>System stable</small></div>
        </div>
      </div>
      <div class="card" style="margin-top:20px; padding:20px;">
        <h3>Recent activity</h3>
        <table>
          <thead><tr><th>Customer</th><th>Stage</th><th>Owner</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>Northwind Labs</td><td>Onboarding</td><td>Alex</td><td>Active</td></tr>
            <tr><td>Summit Works</td><td>QBR</td><td>Priya</td><td>Healthy</td></tr>
            <tr><td>Pilot Studio</td><td>Growth review</td><td>Jordan</td><td>Watch</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
